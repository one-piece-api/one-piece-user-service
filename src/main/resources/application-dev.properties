# This service runs as a pod inside the kind cluster: Keycloak is reached
# via cluster-internal Service DNS. The Keycloak Admin API client secret
# arrives as an env var injected by the Helm chart instead of being
# hardcoded here - see helm/charts/user-service in onepiece-infrastructure.

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://keycloak-http.auth.svc.cluster.local:8080/realms/onepiece/protocol/openid-connect/certs

keycloak.admin.server-url=http://keycloak-http.auth.svc.cluster.local:8080
keycloak.admin.client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET}
