# Runs outside the cluster (e.g. from IntelliJ, for debugging): Keycloak
# still runs in the kind cluster, reached via `kubectl port-forward` rather
# than cluster-internal DNS, which isn't reachable from the host - see
# onepiece-infrastructure/README.md for the exact commands. Values below are
# the same local-only placeholders already committed in that repo
# (helmfile.yaml.gotmpl, keycloak/realm-onepiece.json): safe to hardcode
# here too, never real secrets.

# Avoids clashing with Keycloak's own port-forward on 8080, below.
server.port=8081

# kubectl port-forward svc/keycloak-http -n auth 8080:8080
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/realms/onepiece/protocol/openid-connect/certs

keycloak.admin.server-url=http://localhost:8080
keycloak.admin.client-secret=user-service-admin-change-me-locally

# kubectl port-forward svc/one-piece-app-postgresql -n app 5433:5432
# (5433, not 5432, to leave room for a native/local Postgres on the default
# port). Same local-only placeholder password already committed in
# onepiece-infrastructure/helmfile.yaml.gotmpl - never a real secret.
spring.datasource.url=jdbc:postgresql://localhost:5433/user_service
spring.datasource.password=user-service-db-change-me-locally
