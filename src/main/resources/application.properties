spring.application.name=user-service

# "local" (this service running outside the cluster, e.g. from IntelliJ for
# debugging) is the default so a plain IntelliJ run needs no extra setup.
# The Helm chart explicitly overrides this to "dev" for the pod running
# inside the kind cluster (see helm/charts/user-service in
# onepiece-infrastructure). See application-dev.properties and
# application-local.properties for what differs between the two.
spring.profiles.active=local

# Matches the "/api/" upstream path oauth2-proxy routes to this service
# unchanged (see onepiece-infrastructure/oauth2-proxy/values-oauth2-proxy.yaml)
# so the proxied path and this service's own routes line up with no rewriting.
server.servlet.context-path=/api

# Kubernetes liveness/readiness probe groups, exposed only as /api/actuator/health/*.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# Issuer is always the browser-facing host, regardless of where this process
# itself runs (see onepiece-infrastructure/docs/adr/0001-local-auth-stack.md):
# every token's "iss" claim is fixed to it by Keycloak's own hostname config.
# jwk-set-uri differs per profile (how *this process* reaches Keycloak to
# fetch signing keys) - see application-dev/local.properties.
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/onepiece

# Keycloak Admin API client (Step 3 - admin user listing, UF-IDU-17; Step 4 -
# invite user, UF-IDU-01): a service-account client (view-users, query-users,
# manage-users), see onepiece-infrastructure/keycloak/realm-onepiece.json.
# realm/client-id are identical in every environment; the network path to
# reach Keycloak and the client secret differ per profile - see
# application-dev/local.properties.
keycloak.admin.realm=onepiece
keycloak.admin.client-id=user-service-admin
# Keycloak's own auto-created realm roles, assigned to every account by
# Keycloak itself rather than by an ADMIN: "default-roles-<realm>" (the
# per-realm composite), and the two built-in roles Keycloak seeds in every
# realm for its own token/authorization plumbing, "offline_access" and
# "uma_authorization". None of these are a "product role" an ADMIN assigns,
# so they're excluded from the admin listing (UF-IDU-17). Configured rather
# than hardcoded: this application shouldn't assume how the identity
# provider names or seeds its internal roles, only which ones it was told
# to hide.
keycloak.admin.excluded-realm-roles=default-roles-onepiece,offline_access,uma_authorization

# Where Keycloak's execute-actions-email (UF-IDU-01) sends the browser once
# the invited user completes UPDATE_PASSWORD/VERIFY_EMAIL: the browser-facing
# oauth2-proxy client, same in every environment (see the issuer-uri comment
# above for why) - not a new Keycloak client, see implementation-plan.md's
# Step 4 write-up.
keycloak.invitation.redirect-client-id=onepiece-proxy
keycloak.invitation.redirect-uri=http://localhost:4180/

# The audit trail (Step 4, §13) is this service's only local persistence -
# see docs/adr/0001-audit-log-persistence.md. Database/username are fixed by
# how onepiece-infrastructure provisions app-postgresql; host and password
# differ per profile - see application-dev/local.properties.
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=user_service
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
