spring.application.name=user-service

# "local" (this service running outside the cluster, e.g. from IntelliJ for
# debugging) is the default so a plain IntelliJ run needs no extra setup.
# The Helm chart explicitly overrides this to "dev" for the pod running
# inside the kind cluster (see helm/charts/user-service in
# onepiece-infrastructure). See application-dev.properties and
# application-local.properties for what differs between the two.
spring.profiles.active=local

# Matches the "/api/" upstream path oauth2-proxy routes to this service
# unchanged (see onepiece-infrastructure/oauth2-proxy/values-oauth2-proxy.yaml)
# so the proxied path and this service's own routes line up with no rewriting.
server.servlet.context-path=/api

# Kubernetes liveness/readiness probe groups, exposed only as /api/actuator/health/*.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# Issuer is always the browser-facing host, regardless of where this process
# itself runs (see onepiece-infrastructure/docs/adr/0001-local-auth-stack.md):
# every token's "iss" claim is fixed to it by Keycloak's own hostname config.
# jwk-set-uri differs per profile (how *this process* reaches Keycloak to
# fetch signing keys) - see application-dev/local.properties.
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/onepiece

# Keycloak Admin API client (Step 3 - admin user listing, UF-IDU-17): a
# service-account-only client, read-only (view-users + query-users), see
# onepiece-infrastructure/keycloak/realm-onepiece.json. realm/client-id are
# identical in every environment; the network path to reach Keycloak and the
# client secret differ per profile - see application-dev/local.properties.
keycloak.admin.realm=onepiece
keycloak.admin.client-id=user-service-admin
