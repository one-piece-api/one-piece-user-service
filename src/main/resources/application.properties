spring.application.name=user-service

# Matches the "/api/" upstream path oauth2-proxy routes to this service
# unchanged (see onepiece-infrastructure/oauth2-proxy/values-oauth2-proxy.yaml)
# so the proxied path and this service's own routes line up with no rewriting.
server.servlet.context-path=/api

# Datasource: no hardcoded host/credentials — provided via env vars
# (SPRING_DATASOURCE_URL/USERNAME/PASSWORD, Spring Boot relaxed binding)
# from the Kubernetes Secret/Service, see helm/charts/user-service.

# Kubernetes liveness/readiness probe groups, exposed only as /api/actuator/health/*.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# OAuth2 resource server (Keycloak, realm "onepiece"). Issuer and JWKS endpoint
# are split because the browser and this pod reach Keycloak via different
# hostnames (see onepiece-infrastructure/docs/adr/0001-local-auth-stack.md and
# oauth2-proxy/values-oauth2-proxy.yaml for the same split on the proxy side):
# every token's "iss" claim is always the browser-facing host (Keycloak's
# hostname is fixed to it), while this pod fetches the signing keys via the
# cluster-internal Service DNS. Spring Security still validates the issuer
# claim against issuer-uri even though jwk-set-uri is used to fetch the keys.
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/onepiece
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://keycloak-http.auth.svc.cluster.local:8080/realms/onepiece/protocol/openid-connect/certs
