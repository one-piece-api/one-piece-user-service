info:
  name: listUsers
  type: http
  seq: 1
  tags:
    - Users

http:
  method: GET
  url: "{{baseUrl}}/users"
  params:
    - name: page
      value: "0"
      type: query
      description: Zero-based page index (0..N)
    - name: size
      value: "20"
      type: query
      description: The size of the page to be returned
    - name: sort
      value: "[]"
      type: query
      description: "Sorting criteria in the format: property,(asc|desc). Default sort order is ascending. Multiple sort criteria are supported."
      disabled: true
    - name: q
      value: ""
      type: query
      disabled: true
    - name: role
      value: ""
      type: query
      disabled: true
    - name: status
      value: PENDING
      type: query
      disabled: true
    - name: status
      value: INVITATION_EXPIRED
      type: query
      disabled: true
    - name: status
      value: ACTIVE
      type: query
      disabled: true
    - name: status
      value: DISABLED
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

