info:
  name: inviteUser
  type: http
  seq: 2
  tags:
    - Users

http:
  method: POST
  url: "{{baseUrl}}/users"
  body:
    type: json
    data: |-
      {
        "email": "",
        "roles": []
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 201 Response
    description: Created
    request:
      url: "{{baseUrl}}/users"
      method: POST
      body:
        type: json
        data: |-
          {
            "email": "",
            "roles": []
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "createdAt": "",
            "email": "",
            "roles": [],
            "status": "PENDING",
            "userId": "",
            "username": ""
          }
  - name: 4XX Response
    description: Client error - a problem detail, except a 401/403 rejected by the security filter chain before reaching the application, which has no body
    request:
      url: "{{baseUrl}}/users"
      method: POST
      body:
        type: json
        data: |-
          {
            "email": "",
            "roles": []
          }
    response:
      headers:
        - name: Content-Type
          value: application/problem+json
      body:
        type: json
        data: |-
          {
            "detail": "",
            "errorCode": "",
            "errors": [
              {
                "field": "",
                "message": ""
              }
            ],
            "instance": "",
            "status": 0,
            "timestamp": "",
            "title": "",
            "traceId": "",
            "type": ""
          }
  - name: 5XX Response
    description: Unexpected server error
    request:
      url: "{{baseUrl}}/users"
      method: POST
      body:
        type: json
        data: |-
          {
            "email": "",
            "roles": []
          }
    response:
      headers:
        - name: Content-Type
          value: application/problem+json
      body:
        type: json
        data: |-
          {
            "detail": "",
            "errorCode": "",
            "errors": [
              {
                "field": "",
                "message": ""
              }
            ],
            "instance": "",
            "status": 0,
            "timestamp": "",
            "title": "",
            "traceId": "",
            "type": ""
          }
