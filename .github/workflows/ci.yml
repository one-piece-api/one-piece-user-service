name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check formatting (spring-javaformat)
        run: ./gradlew checkFormat --no-daemon

      - name: Run Checkstyle
        run: ./gradlew checkstyleMain checkstyleTest --no-daemon

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run tests
        run: ./gradlew test --no-daemon

  build-and-push:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Read version
        id: version
        run: echo "version=$(./gradlew properties -q | grep '^version:' | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Senza questo, buildx pubblica anche un manifest di provenance
          # untagged accanto all'immagine: il job cleanup-untagged sotto lo
          # cancella (ha tags == [], come ogni versione davvero orfana), ma
          # quel manifest è referenziato dall'indice a cui punta ":latest",
          # che quindi smette di essere pull-abile ("manifest not found").
          provenance: false
          tags: |
            ghcr.io/one-piece-api/user-service:${{ steps.version.outputs.version }}
            ghcr.io/one-piece-api/user-service:latest

  cleanup-untagged:
    name: Delete untagged package versions
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push'
    continue-on-error: true
    env:
      GH_TOKEN: ${{ secrets.GHCR_CLEANUP_TOKEN }}
    steps:
      - name: Delete dangling (untagged) versions from GHCR
        run: |
          gh api --paginate "orgs/one-piece-api/packages/container/user-service/versions" \
            --jq '.[] | select(.metadata.container.tags == []) | .id' \
          | xargs -r -I{} gh api --method DELETE "orgs/one-piece-api/packages/container/user-service/versions/{}"
